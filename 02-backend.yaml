apiVersion: apps/v1
kind: Deployment
metadata:
    name: backend
    namespace: alentapp
    labels: { app: backend, tier: backend }
spec:
    replicas: 2
    selector: { matchLabels: { app: backend } }
    template:
        metadata: { labels: { app: backend, tier: backend } }
        spec:
            containers:
                - name: backend
                  image: alentapp-backend:prod
                  imagePullPolicy: IfNotPresent
                  # Sin override de command: la imagen de prod ya trae su propio CMD
                  # ("node packages/api/dist/app.js"). Las migraciones NO corren acá
                  # -- correrlas antes con scripts/00-migrate-db.sh.
                  ports: [{ containerPort: 3000, name: http }]
                  env:
                      - name: DATABASE_URL
                        value: postgres://admin:password123@db.alentapp:5432/alentapp_db
                      - name: PORT
                        value: '3000'
                  readinessProbe:
                      httpGet: { path: /health, port: 3000 }
                      initialDelaySeconds: 5
                      periodSeconds: 5
                  livenessProbe:
                      httpGet: { path: /health, port: 3000 }
                      initialDelaySeconds: 10
                      periodSeconds: 10
                  resources:
                      requests: { cpu: 150m, memory: 256Mi }
                      limits: { cpu: 750m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
    name: backend
    namespace: alentapp
spec:
    selector: { app: backend }
    ports:
        - port: 3000
          targetPort: 3000
